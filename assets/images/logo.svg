<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 85" width="100%" height="100%" fill="none">
  <defs>
    <!-- Cyan to Royal Blue Gradient -->
    <linearGradient id="leafBlueGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    
    <!-- Lime to Emerald Green Gradient -->
    <linearGradient id="leafGreenGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#15803D"/>
      <stop offset="60%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#84CC16"/>
    </linearGradient>
    
    <!-- Deep Amber to Orange Gradient -->
    <linearGradient id="leafOrangeGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EA580C"/>
      <stop offset="60%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
  </defs>

  <!-- 3 Blooming Leaves Icon (Accurately positioned above 'M') -->
  <g transform="translate(210, 6) scale(0.68)">
    <!-- Cyan / Blue Leaf (Left) -->
    <path d="M10,42 C2,26 12,8 28,3 C30,15 24,34 10,42 Z" fill="url(#leafBlueGrad)" />
    <!-- Center Green Leaf (Upright) -->
    <path d="M34,38 C30,16 42,2 60,0 C64,16 56,33 34,38 Z" fill="url(#leafGreenGrad)" />
    <!-- Orange / Yellow Leaf (Right) -->
    <path d="M40,42 C54,33 72,36 80,50 C66,57 48,52 40,42 Z" fill="url(#leafOrangeGrad)" />
  </g>

  <!-- SHIVAM Bold Modern Geometric Typography -->
  <text x="4" y="55" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Montserrat', sans-serif" font-weight="900" font-size="44" fill="#182230" letter-spacing="-0.5">SHIVAM</text>

  <!-- RESIDENCY Subtitle with Sophisticated Luxury Letter-Spacing -->
  <text x="8" y="76" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-weight="600" font-size="11.5" fill="#64748B" letter-spacing="7">RESIDENCY</text>
</svg>
